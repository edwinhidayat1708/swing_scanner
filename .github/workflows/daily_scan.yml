name: Daily Swing Scanner

on:
  schedule:
    # Berjalan setiap Senin-Jumat jam 10:00 UTC (17:00 WIB)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Memungkinkan jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    
    # PERBAIKAN: Memberikan izin tulis agar bisa push log_rekomendasi_swing_v3.csv
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance xgboost scikit-learn requests

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_scanner_idx.py

      - name: Commit & Push Log changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Cek apakah file benar-benar ada sebelum git add
          if [ -f log_rekomendasi_swing_v3.csv ]; then
            git add log_rekomendasi_swing_v3.csv
            # Commit hanya jika ada perubahan agar tidak exit dengan error jika tidak ada sinyal baru
            git commit -m "Update log harian [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "File log tidak ditemukan atau tidak ada sinyal baru hari ini."
          fi
