name: Daily Swing Scanner

on:
  schedule:
    # Berjalan setiap Senin-Jumat jam 10:00 UTC (17:00 WIB)
    - cron: '0 10 * * 1-5'
  workflow_dispatch: # Memungkinkan jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance xgboost requests

      - name: Run Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_scanner_idx.py

      - name: Commit & Push Log changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add log_rekomendasi_swing_v3.csv
          git commit -m "Update log harian [skip ci]" || echo "No changes to commit"
          git push
